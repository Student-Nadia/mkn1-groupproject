server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /etc/fw/web.crt;
    ssl_certificate_key /etc/fw/web.key;
    root /usr/share/fw/web/public;
    index index.php;

    location / { try_files $uri /index.php?$query_string; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/fw/web-php.sock;
    }
}
